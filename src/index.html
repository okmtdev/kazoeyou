<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>かぞえよう！</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- タイトル画面 -->
    <div id="screen-title" class="screen active">
      <div class="title-container">
        <h1 class="game-title">🔢 かぞえよう！</h1>
        <div class="setting-group">
          <p class="setting-label">なんいど</p>
          <div class="btn-group">
            <button class="btn btn-easy selected" data-difficulty="easy">かんたん</button>
            <button class="btn btn-normal" data-difficulty="normal">ふつう</button>
            <button class="btn btn-hard" data-difficulty="hard">むずかしい</button>
          </div>
        </div>
        <div class="setting-group">
          <p class="setting-label">かいとうほうほう</p>
          <div class="btn-group">
            <button class="btn btn-select selected" data-method="select">せんたく</button>
            <button class="btn btn-draw" data-method="draw">てがき</button>
          </div>
        </div>
        <button id="btn-start" class="btn btn-start-game">はじめる！</button>
      </div>
    </div>

    <!-- ステージ選択画面 -->
    <div id="screen-stages" class="screen">
      <div class="stage-header">
        <button id="btn-back-title" class="btn btn-small">もどる</button>
        <h2 id="stage-difficulty-label" class="stage-title"></h2>
      </div>
      <div id="stage-list" class="stage-list"></div>
    </div>

    <!-- ゲーム画面 -->
    <div id="screen-game" class="screen">
      <div class="game-header">
        <button id="btn-back-stages" class="btn btn-small">もどる</button>
        <p id="game-question" class="game-question"></p>
        <p id="game-stage-num" class="game-stage-num"></p>
      </div>
      <div id="game-field" class="game-field"></div>
      <div id="answer-area" class="answer-area"></div>
    </div>

    <!-- 答え合わせ画面 -->
    <div id="screen-result" class="screen">
      <div id="result-content" class="result-content">
        <h2 id="result-title" class="result-title"></h2>
        <div id="result-field" class="result-field"></div>
        <p id="result-count" class="result-count"></p>
        <button id="btn-next" class="btn btn-start-game" style="display:none;">つぎへ</button>
        <button id="btn-retry" class="btn btn-start-game" style="display:none;">もういちど</button>
        <button id="btn-back-result" class="btn btn-small" style="display:none;">ステージへ</button>
      </div>
    </div>
  </div>

  <script src="stages.js"></script>
  <script src="handwriting.js"></script>
  <script src="game.js"></script>
</body>
</html>
